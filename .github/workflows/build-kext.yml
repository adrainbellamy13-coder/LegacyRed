name: Build Kext

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Automatically pulls MacKernelSDK

    - name: Build LegacyRed
      run: |
        xcodebuild \
          -project "LegacyRed.xcodeproj" \
          -target "LegacyRed" \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Upload Kext Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LegacyRed-Kext
        path: build/Release/*.kext
